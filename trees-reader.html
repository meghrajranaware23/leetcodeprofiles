<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trees Ascension — Master 28 tree patterns in 30 days. Visual-first tree learning with the Solo Leveling rank system.">
  <title>Trees Ascension — Course Reader</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&family=Sora:wght@400;500;600&family=Source+Code+Pro:wght@400&display=swap" rel="stylesheet">

  <!-- Highlight.js theme + core -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>

  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Our styles -->
  <link rel="stylesheet" href="./course-reader.css">
</head>
<body data-pack="trees">

  <!-- ═══════════ TOP BAR ═══════════ -->
  <header class="cr-topbar" id="topbar">
    <div class="cr-topbar-left">
      <button class="cr-sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle sidebar">
        <span class="cr-toggle-bar"></span>
        <span class="cr-toggle-bar"></span>
        <span class="cr-toggle-bar"></span>
      </button>
      <a href="./packs.html" class="cr-back-btn" id="backBtn" aria-label="Back to all packs">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>All Packs</span>
      </a>
      <div class="cr-pack-switcher" id="packSwitcher"></div>
      <div class="cr-topbar-divider"></div>
      <span class="cr-course-title" id="courseTitle">Trees Ascension</span>
    </div>
    <div class="cr-topbar-right">
      <div class="cr-progress-info" id="progressInfo">
        <span class="cr-progress-text" id="progressText">0 / 0 completed</span>
        <div class="cr-progress-bar-mini">
          <div class="cr-progress-fill-mini" id="progressFill"></div>
        </div>
      </div>
      <div class="cr-xp-badge" id="xpBadge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span id="xpValue">0</span> XP
      </div>
      <div id="reader-auth" class="cr-reader-auth"></div>
    </div>
  </header>

  <!-- ═══════════ MAIN LAYOUT ═══════════ -->
  <div class="cr-layout">

    <!-- SIDEBAR OVERLAY (mobile) -->
    <div class="cr-sidebar-overlay" id="sidebarOverlay"></div>

    <!-- LEFT SIDEBAR -->
    <aside class="cr-sidebar" id="sidebar">
      <div class="cr-sidebar-header">
        <span class="cr-sidebar-label">COURSE NAVIGATION</span>
      </div>
      <nav class="cr-sidebar-inner" id="sidebarNav" aria-label="Course navigation">
        <!-- Populated by JS -->
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="cr-main" id="main">
      <article class="cr-content" id="content">
        <!-- Rendered markdown goes here -->
        <div class="cr-loading" id="loadingIndicator">
          <div class="cr-spinner"></div>
          <span>Loading lesson…</span>
        </div>
      </article>

      <!-- BOTTOM NAVIGATION -->
      <div class="cr-bottom-nav" id="bottomNav">
        <button class="cr-nav-btn cr-prev-btn" id="prevBtn" aria-label="Previous lesson">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>Previous</span>
        </button>
        <button class="cr-mark-complete-btn" id="markCompleteBtn" type="button" aria-label="Mark as complete">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Mark as Complete</span>
        </button>
        <button class="cr-nav-btn cr-next-btn" id="nextBtn" aria-label="Next lesson">
          <span>Next</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </main>

  </div>

  <!-- Milestone celebration overlay -->
  <div class="cr-milestone-overlay" id="milestoneOverlay" hidden aria-hidden="true">
    <div class="cr-milestone-card" role="dialog" aria-labelledby="milestoneTitle">
      <div class="cr-milestone-glow"></div>
      <div class="cr-milestone-icon" id="milestoneIcon">🏆</div>
      <p class="cr-milestone-label" id="milestoneLabel">MISSION COMPLETE</p>
      <h2 class="cr-milestone-title" id="milestoneTitle">Quest Cleared!</h2>
      <p class="cr-milestone-msg" id="milestoneMsg"></p>
      <div class="cr-milestone-xp" id="milestoneXp"></div>
      <button class="cr-milestone-btn" id="milestoneBtn" type="button">Continue Ascending →</button>
    </div>
  </div>

  <!-- Module scripts -->
  <script type="module" src="./trees-reader.js"></script>
</body>
</html>
